<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="fs-4 text-primary me-2"><i class="bi bi-shield-check"></i></span>
            <span class="fw-bold tracking-tight text-white">SmartServe</span>
            <span class="brand-badge">DevOps Edition</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#smartServeNavbar"
                aria-controls="smartServeNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="smartServeNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'home'} ? 'active text-primary fw-bold' : 'text-light'" th:href="@{/}">
                        <i class="bi bi-house me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'submit'} ? 'active text-primary fw-bold' : 'text-light'" th:href="@{/complaints/new}">
                        <i class="bi bi-file-earmark-plus me-1"></i> Submit Complaint
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'track'} ? 'active text-primary fw-bold' : 'text-light'" th:href="@{/complaints/track}">
                        <i class="bi bi-search me-1"></i> Track Status
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${activePage == 'admin'} ? 'active text-primary fw-bold' : 'text-light'" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Admin Dashboard
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center">
                <!-- If Admin is authenticated -->
                <div sec:authorize="hasRole('ADMIN')" class="d-flex align-items-center">
                    <span class="badge bg-secondary me-3 py-2 px-3">
                        <i class="bi bi-person-circle me-1"></i> Administrator
                    </span>
                    <form th:action="@{/admin/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </div>

                <!-- If User is unauthenticated -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/admin/login}" class="btn btn-outline-light btn-sm px-3">
                        <i class="bi bi-lock me-1"></i> Admin Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
</html>
