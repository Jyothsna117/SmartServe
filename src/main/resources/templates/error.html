<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - SmartServe</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar('')}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 text-center">
                    <div class="card shadow border-0 rounded-4 p-5 bg-white">
                        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle" style="width: 80px; height: 80px;">
                            <i class="bi bi-shield-x fs-1"></i>
                        </div>

                        <h1 class="display-3 fw-bold text-danger mb-2" th:text="${statusCode != null ? statusCode : '500'}">500</h1>
                        <h4 class="fw-bold mb-3">Something Went Wrong</h4>

                        <p class="text-secondary mb-4" th:text="${errorMessage}">
                            An unexpected error occurred while processing your request.
                        </p>

                        <div class="d-flex justify-content-center gap-3">
                            <a th:href="@{/}" class="btn btn-primary px-4">
                                <i class="bi bi-house me-1"></i> Back to Home
                            </a>
                            <a th:href="@{/complaints/track}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-search me-1"></i> Track Complaint
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
