# ==============================================================================
# SmartServe Application Configuration
# ==============================================================================

spring.application.name=SmartServe
server.port=8080

# ------------------------------------------------------------------------------
# MongoDB Configuration
# Default: mongodb://localhost:27017/smartserve_db
# Override via environment variable SPRING_DATA_MONGODB_URI
# (e.g. for Docker: mongodb://host.docker.internal:27017/smartserve_db)
# (e.g. for Kubernetes: mongodb://mongodb-service:27017/smartserve_db)
# ------------------------------------------------------------------------------
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smartserve_db}
spring.data.mongodb.auto-index-creation=true

# ------------------------------------------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Actuator Health Check (Used by Docker HEALTHCHECK & Kubernetes Probes)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ------------------------------------------------------------------------------
# Administrator Credentials Configuration
# Configurable via environment variables SMARTSERVE_ADMIN_USER & SMARTSERVE_ADMIN_PASSWORD
# Demonstration defaults provided for academic viva and local lab evaluation.
# ------------------------------------------------------------------------------
smartserve.admin.username=${SMARTSERVE_ADMIN_USER:admin}
smartserve.admin.password=${SMARTSERVE_ADMIN_PASSWORD:SmartServe@2026Admin}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartserve=DEBUG
logging.level.org.springframework.data.mongodb=INFO
