# ==============================================================================
# SmartServe NodePort Service
# Exposes the Spring Boot application outside the cluster for browser access
# NodePort: 30080
# Cluster Port: 8080
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: smartserve-service
  labels:
    app: smartserve
    project: smartserve
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: smartserve
