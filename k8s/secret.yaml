# Sensitive credentials mounted as environment variables in Pods.
# Note: For production use, replace stringData with sealed secrets or Vault.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: smartserve-secret
  labels:
    app: smartserve
    project: smartserve
type: Opaque
stringData:
  SMARTSERVE_ADMIN_USER: "admin"
  SMARTSERVE_ADMIN_PASSWORD: "SmartServe@2026Admin"
